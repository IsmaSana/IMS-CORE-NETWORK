```ini
#
# TLS Configuration File
#

# This is the default server domain, settings
# in this domain will be used for all incoming
# connections that do not match any other server
# domain in this configuration file.
#
[server:default]
method = SSLv23
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/kamailio-selfsigned.key
certificate = /etc/kamailio/kamailio-selfsigned.pem
```

### Notes for deployment

- This configuration uses a self-signed certificate.
- The private key and certificate files must exist at the specified paths on the target server.
- These certificate files are not included in this repository.
- `verify_certificate = no` and `require_certificate = no` are settings for this laboratory environment. They should be reviewed before any production deployment.
